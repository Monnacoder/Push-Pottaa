services:
  - type: web
    name: therivili
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: APP_NAME
        value: Therivili
