services:
  - type: web
    name: push-pottaa
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: APP_NAME
        value: Push Pottaa
