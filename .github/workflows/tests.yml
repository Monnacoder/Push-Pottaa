name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Run automated tests
        run: npm test
