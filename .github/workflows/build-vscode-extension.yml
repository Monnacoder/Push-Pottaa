name: Build VS Code extension
on:
  push:
    branches: [main]
    paths:
      - 'roasts.js'
      - 'package.json'
      - 'scripts/generate-vscode-roasts.js'
      - 'vscode-extension/**'
      - '.github/workflows/build-vscode-extension.yml'
  pull_request:
    paths:
      - 'roasts.js'
      - 'package.json'
      - 'scripts/generate-vscode-roasts.js'
      - 'vscode-extension/**'
      - '.github/workflows/build-vscode-extension.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Validate extension manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('vscode-extension/package.json','utf8'))"
      - name: Generate the shared Therivili list
        run: node scripts/generate-vscode-roasts.js
      - name: Check action detection and message data
        run: node --test vscode-extension/*.test.cjs
      - name: Package the installable extension
        run: npx --yes @vscode/vsce package vscode-extension --out push-pottaa.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: push-pottaa-vsix
          path: push-pottaa.vsix
          if-no-files-found: error
          retention-days: 30
